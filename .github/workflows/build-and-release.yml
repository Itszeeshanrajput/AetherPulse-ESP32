name: Build, WebFlash & Auto-Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compile Firmware & Generate Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO & pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO & esptool
        run: pip install --upgrade pip platformio esptool

      - name: Extract Version from config.h
        id: ver
        run: |
          VERSION=$(grep -E '#define\s+PROJECT_VERSION' config.h | awk -F'"' '{print $2}')
          echo "version=${VERSION:-v3.1.0}" >> "$GITHUB_OUTPUT"

      - name: Compile AetherPulse Firmware
        run: pio run -e esp32_repeater

      - name: Package Merged & Split Binaries
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BOOT_APP0=$(find ~/.platformio -name "boot_app0.bin" | head -n 1)
          mkdir -p bin docs
          cp .pio/build/esp32_repeater/bootloader.bin bin/bootloader.bin
          cp .pio/build/esp32_repeater/partitions.bin bin/partitions.bin
          cp "$BOOT_APP0" bin/boot_app0.bin
          cp .pio/build/esp32_repeater/firmware.bin bin/firmware.bin
          cp .pio/build/esp32_repeater/firmware.bin "bin/AetherPulse-${VERSION}.bin"

          esptool.py --chip esp32 merge-bin -o "bin/AetherPulse-${VERSION}.merged.bin" \
            --flash-mode dio --flash-freq 80m --flash-size 4MB \
            0x1000 bin/bootloader.bin \
            0x8000 bin/partitions.bin \
            0xe000 bin/boot_app0.bin \
            0x10000 bin/firmware.bin

          cp bin/bootloader.bin bin/partitions.bin bin/boot_app0.bin bin/firmware.bin \
             "bin/AetherPulse-${VERSION}.bin" "bin/AetherPulse-${VERSION}.merged.bin" docs/

      - name: Commit Updated Web Flasher Binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/*.bin bin/*.bin
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: auto-update web flasher binaries [skip ci]" && git push)

      - name: Setup GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('AetherPulse {0}', github.ref_name) || format('AetherPulse {0} (Latest)', steps.ver.outputs.version) }}
          body: |
            ### AetherPulse ${{ steps.ver.outputs.version }} — ESP32 Wi-Fi Repeater & lwIP NAPT Appliance

            Automated production binaries compiled with PlatformIO (`min_spiffs` partition scheme, 80 MHz DIO flash).

            #### 1-Click Browser Web Installer
            [Open AetherPulse Web Installer](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)

            #### Included Firmware Files
            - `AetherPulse-${{ steps.ver.outputs.version }}.merged.bin`: Complete flash image (offset `0x0`)
            - `AetherPulse-${{ steps.ver.outputs.version }}.bin` / `firmware.bin`: Application image (offset `0x10000`)
            - `bootloader.bin` (`0x1000`), `partitions.bin` (`0x8000`), `boot_app0.bin` (`0xe000`)
          files: |
            bin/AetherPulse-${{ steps.ver.outputs.version }}.merged.bin
            bin/AetherPulse-${{ steps.ver.outputs.version }}.bin
            bin/firmware.bin
            bin/bootloader.bin
            bin/partitions.bin
            bin/boot_app0.bin
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') || contains(steps.ver.outputs.version, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Mark and Close Stale Issues and PRs

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Manage Stale Issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Mark and Close Stale Issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity over the past 60 days. It will be closed in 7 days if no further activity occurs. Thank you for your contributions to AetherPulse!
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity over the past 60 days. It will be closed in 7 days if no further activity occurs. Thank you for your contributions to AetherPulse!
          close-issue-message: |
            This issue was closed because it has been inactive for 7 days since being marked as stale. If you believe this is still relevant, please feel free to reopen it or leave a comment.
          close-pr-message: |
            This pull request was closed because it has been inactive for 7 days since being marked as stale. If you would like to continue working on this, feel free to reopen it.
          exempt-issue-labels: 'pinned, roadmap, help wanted, good first issue'
          exempt-pr-labels: 'pinned, roadmap, help wanted, good first issue'

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="hubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="1080" height="720" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Window Titlebar -->
  <rect width="1080" height="42" rx="16" fill="#0f172a" />
  <circle cx="24" cy="21" r="6" fill="#ef4444" />
  <circle cx="44" cy="21" r="6" fill="#f59e0b" />
  <circle cx="64" cy="21" r="6" fill="#10b981" />
  <rect x="240" y="8" width="600" height="26" rx="6" fill="#1e293b" />
  <text x="540" y="25" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#94a3b8" text-anchor="middle">http://192.168.4.1/ — AetherPulse v3.0.1 Web Portal</text>

  <!-- Content Padding -->
  <g transform="translate(36, 56)">
    <!-- Header -->
    <text x="0" y="26" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" fill="#ffffff">
      AETHER<tspan fill="#38bdf8">PULSE</tspan> <tspan font-size="14" fill="#0ea5e9" font-weight="700">v3.0.1</tspan>
    </text>
    <text x="0" y="44" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">
      Zero-Jitter NAPT Wi-Fi Repeater &amp; Router • aetherpulse.local • Architected by Zeeshan Rajput
    </text>

    <!-- Header Live Badges -->
    <g transform="translate(710, 8)">
      <rect x="0" y="0" width="140" height="30" rx="15" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
      <circle cx="14" cy="15" r="4" fill="#10b981" filter="url(#glow)" />
      <text x="26" y="19" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#10b981">ONLINE (Uplink-AP)</text>

      <rect x="150" y="0" width="130" height="30" rx="15" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" stroke-width="1" />
      <circle cx="164" cy="15" r="4" fill="#0ea5e9" />
      <text x="176" y="19" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" fill="#38bdf8">TPC: 20.5 dBm</text>
    </g>

    <!-- Navigation Tabs -->
    <g transform="translate(0, 64)">
      <!-- Tab 1: Dashboard -->
      <rect x="0" y="0" width="90" height="32" rx="8" fill="transparent" />
      <text x="45" y="20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Dashboard</text>

      <!-- Tab 2: Topology (ACTIVE) -->
      <rect x="96" y="0" width="105" height="32" rx="8" fill="rgba(14, 165, 233, 0.2)" stroke="#0ea5e9" stroke-width="1" />
      <text x="148" y="20" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" text-anchor="middle">🌐 Topology</text>

      <!-- Tab 3: Spectrum -->
      <rect x="208" y="0" width="85" height="32" rx="8" fill="transparent" />
      <text x="250" y="20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Spectrum</text>

      <!-- Tab 4: Clients -->
      <rect x="300" y="0" width="80" height="32" rx="8" fill="transparent" />
      <text x="340" y="20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Clients (3)</text>

      <!-- Tab 5: Security -->
      <rect x="388" y="0" width="85" height="32" rx="8" fill="transparent" />
      <text x="430" y="20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Security</text>

      <!-- Tab 6: Port Forwarding -->
      <rect x="480" y="0" width="120" height="32" rx="8" fill="transparent" />
      <text x="540" y="20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Port Forwarding</text>

      <!-- Tab 7: Failover Pool -->
      <rect x="608" y="0" width="100" height="32" rx="8" fill="transparent" />
      <text x="658" y="20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Failover Pool</text>

      <!-- Tab 8: Settings -->
      <rect x="716" y="0" width="85" height="32" rx="8" fill="transparent" />
      <text x="758" y="20" font-family="-apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle">Settings</text>
    </g>

    <!-- Main Topology Canvas Card -->
    <g transform="translate(0, 112)">
      <!-- Canvas Card Container -->
      <rect width="1008" height="375" rx="14" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />

      <!-- Canvas Title & Info -->
      <text x="24" y="30" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#ffffff">
        Interactive Network Topology Graph
      </text>
      <text x="24" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#64748b">
        Live orbital packet flow: WAN Gateway &rarr; Repeater Hub &rarr; Connected Devices • Zero MCU load
      </text>

      <!-- Grid Background lines on canvas -->
      <g opacity="0.08">
        <line x1="24" y1="120" x2="984" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
        <line x1="24" y1="200" x2="984" y2="200" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
        <line x1="24" y1="280" x2="984" y2="280" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3" />
        <circle cx="504" cy="200" r="160" fill="none" stroke="#38bdf8" stroke-width="1" />
        <circle cx="504" cy="200" r="280" fill="none" stroke="#38bdf8" stroke-width="1" />
      </g>

      <!-- Bezier Curved Packet Flow Links -->
      <!-- Link 1: Upstream AP to Repeater -->
      <path d="M 180 200 C 320 160, 380 200, 470 200" fill="none" stroke="rgba(16, 185, 129, 0.45)" stroke-width="2.5" />
      <!-- Link 2: Repeater to Client 1 (Top) -->
      <path d="M 538 185 C 620 120, 720 110, 810 110" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="2.5" />
      <!-- Link 3: Repeater to Client 2 (Middle) -->
      <path d="M 540 200 C 630 200, 720 200, 810 200" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="2.5" />
      <!-- Link 4: Repeater to Client 3 (Bottom) -->
      <path d="M 538 215 C 620 280, 720 290, 810 290" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-width="2.5" />

      <!-- Glowing Bezier Particles -->
      <circle cx="320" cy="188" r="3.5" fill="#10b981" filter="url(#glow)" />
      <circle cx="380" cy="198" r="3.5" fill="#10b981" filter="url(#glow)" />
      <circle cx="640" cy="145" r="3.5" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="730" cy="115" r="3.5" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="670" cy="200" r="3.5" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="650" cy="255" r="3.5" fill="#38bdf8" filter="url(#glow)" />
      <circle cx="740" cy="285" r="3.5" fill="#38bdf8" filter="url(#glow)" />

      <!-- Node 1: Upstream AP (Left) -->
      <g transform="translate(140, 160)">
        <circle cx="40" cy="40" r="34" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2" />
        <circle cx="40" cy="40" r="24" fill="url(#emeraldGrad)" />
        <text x="40" y="44" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">WAN</text>
        <text x="40" y="90" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">Uplink Router</text>
        <text x="40" y="104" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#10b981" text-anchor="middle">-74 dBm • CH 7</text>
      </g>

      <!-- Node 2: AetherPulse Repeater Hub (Center) -->
      <g transform="translate(460, 155)">
        <circle cx="44" cy="45" r="46" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" stroke-width="2" />
        <circle cx="44" cy="45" r="32" fill="url(#hubGrad)" filter="url(#glow)" />
        <text x="44" y="49" font-family="-apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">HUB</text>
        <text x="44" y="108" font-family="-apple-system, sans-serif" font-weight="800" font-size="12.5" fill="#ffffff" text-anchor="middle">AetherPulse v3.0.1</text>
        <text x="44" y="122" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#38bdf8" text-anchor="middle">192.168.4.1 • 240 MHz</text>
      </g>

      <!-- Node 3: Client 1 - MacBook Pro (Top Right) -->
      <g transform="translate(810, 80)">
        <circle cx="30" cy="30" r="26" fill="rgba(30, 41, 59, 0.8)" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="30" cy="30" r="18" fill="#1e293b" />
        <text x="30" y="34" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">💻</text>
        <text x="70" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#ffffff">MacBook Pro</text>
        <text x="70" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Apple • -42 dBm (192.168.4.2)</text>
      </g>

      <!-- Node 4: Client 2 - iPhone 15 Pro (Middle Right) -->
      <g transform="translate(810, 170)">
        <circle cx="30" cy="30" r="26" fill="rgba(30, 41, 59, 0.8)" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="30" cy="30" r="18" fill="#1e293b" />
        <text x="30" y="34" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">📱</text>
        <text x="70" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#ffffff">iPhone 15 Pro</text>
        <text x="70" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Apple • -55 dBm (192.168.4.3)</text>
      </g>

      <!-- Node 5: Client 3 - Smart TV (Bottom Right) -->
      <g transform="translate(810, 260)">
        <circle cx="30" cy="30" r="26" fill="rgba(30, 41, 59, 0.8)" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="30" cy="30" r="18" fill="#1e293b" />
        <text x="30" y="34" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">📺</text>
        <text x="70" y="28" font-family="-apple-system, sans-serif" font-weight="700" font-size="11.5" fill="#ffffff">Samsung Smart TV</text>
        <text x="70" y="42" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">Samsung • -61 dBm (192.168.4.4)</text>
      </g>
    </g>

    <!-- Bottom Telemetry Metric Cards -->
    <g transform="translate(0, 502)">
      <!-- Metric 1: Dynamic TPC -->
      <rect x="0" y="0" width="237" height="100" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <text x="18" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Dynamic TPC RF Power</text>
      <text x="18" y="58" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" fill="#38bdf8">20.5 dBm</text>
      <text x="18" y="80" font-family="-apple-system, sans-serif" font-size="10.5" fill="#10b981">● Closed-Loop Auto Scaled</text>

      <!-- Metric 2: Zero-Copy lwIP NAPT -->
      <rect x="257" y="0" width="237" height="100" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <text x="275" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Zero-Copy lwIP NAPT</text>
      <text x="275" y="58" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" fill="#ffffff">1,024 Flows</text>
      <text x="275" y="80" font-family="-apple-system, sans-serif" font-size="10.5" fill="#38bdf8">● TCP MSS: 1412 B Clamped</text>

      <!-- Metric 3: Free DRAM Heap -->
      <rect x="514" y="0" width="237" height="100" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <text x="532" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Free Internal DRAM Heap</text>
      <text x="532" y="58" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" fill="#10b981">174.2 KB</text>
      <text x="532" y="80" font-family="-apple-system, sans-serif" font-size="10.5" fill="#10b981">● 0 Bytes Leaked (Rock Solid)</text>

      <!-- Metric 4: Silicon Die Temperature -->
      <rect x="771" y="0" width="237" height="100" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.2" />
      <text x="789" y="28" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Die Thermals &amp; TWDT</text>
      <text x="789" y="58" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" fill="#ffffff">51.1 °C</text>
      <text x="789" y="80" font-family="-apple-system, sans-serif" font-size="10.5" fill="#10b981">● Normal (&gt;22°C Margin)</text>
    </g>
  </g>
</svg>

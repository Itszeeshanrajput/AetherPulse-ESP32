<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>
    <linearGradient id="quantumGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Quantum Grid & Wave Lines -->
  <g opacity="0.12">
    <line x1="0" y1="95" x2="1200" y2="95" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="0" y1="190" x2="1200" y2="190" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="0" y1="285" x2="1200" y2="285" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,4" />
  </g>
  <path d="M 0 170 Q 300 70, 600 170 T 1200 170" fill="none" stroke="rgba(6, 182, 212, 0.22)" stroke-width="2" />
  <path d="M 0 210 Q 300 310, 600 210 T 1200 210" fill="none" stroke="rgba(139, 92, 246, 0.22)" stroke-width="2" />
  <circle cx="600" cy="190" r="240" fill="none" stroke="rgba(59, 130, 246, 0.06)" stroke-width="1.5" />

  <!-- Central Logo Box -->
  <g transform="translate(80, 55)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#quantumGrad)" filter="url(#glow)" opacity="0.4" />
    <rect x="0" y="0" width="88" height="88" rx="22" fill="url(#quantumGrad)" />
    <!-- Wi-Fi Pulse Waves Symbol -->
    <path d="M 44 24 C 30 24 18 29 10 39 L 44 76 L 78 39 C 70 29 58 24 44 24 Z" fill="#ffffff" />
    <circle cx="44" cy="72" r="3.5" fill="#06b6d4" />
  </g>

  <!-- Title & Subtitle -->
  <text x="190" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
    AETHER<tspan fill="#06b6d4">PULSE</tspan> <tspan fill="url(#quantumGrad)">v3.0 QUANTUM</tspan>
  </text>
  <text x="190" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#38bdf8" letter-spacing="0.5">
    Architected &amp; Engineered by Zeeshan Rajput • Enterprise Silicon Edition
  </text>
  <text x="190" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="13.5" fill="#94a3b8">
    Zero-Jitter Wi-Fi Extender • Sub-ms SRAM DNS Cache • 2.4 GHz RF Spectrum Heatmap • Smart Device Manager
  </text>

  <!-- Version & License Pills -->
  <g transform="translate(900, 55)">
    <rect x="0" y="0" width="220" height="32" rx="16" fill="rgba(6, 182, 212, 0.12)" stroke="#06b6d4" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#06b6d4" />
    <text x="28" y="21" font-family="monospace" font-weight="700" font-size="12" fill="#06b6d4">ENTERPRISE v3.0.0</text>
    
    <rect x="0" y="42" width="220" height="32" rx="16" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1" />
    <circle cx="16" cy="58" r="4" fill="#10b981" />
    <text x="28" y="63" font-family="monospace" font-weight="700" font-size="12" fill="#10b981">HARDWARE TESTED OK</text>
  </g>

  <!-- Feature Badges Row -->
  <g transform="translate(80, 205)">
    <!-- Badge 1: DNS Cache -->
    <rect x="0" y="0" width="245" height="90" rx="14" fill="url(#badgeGrad)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="1" />
    <text x="20" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="13.5" fill="#06b6d4">⚡ SUB-MS DNS CACHE</text>
    <text x="20" y="54" font-family="monospace" font-size="11.5" fill="#e2e8f0">0.2 ms SRAM Lookups</text>
    <text x="20" y="72" font-family="sans-serif" font-size="10.5" fill="#94a3b8">LFU Eviction &amp; Telemetry</text>

    <!-- Badge 2: Spectrum -->
    <rect x="265" y="0" width="245" height="90" rx="14" fill="url(#badgeGrad)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
    <text x="285" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="13.5" fill="#38bdf8">📊 RF SPECTRUM SCANNER</text>
    <text x="285" y="54" font-family="monospace" font-size="11.5" fill="#e2e8f0">CH 1-13 Density Heatmap</text>
    <text x="285" y="72" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Automated Best Channel</text>

    <!-- Badge 3: Client Manager -->
    <rect x="530" y="0" width="245" height="90" rx="14" fill="url(#badgeGrad)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" />
    <text x="550" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="13.5" fill="#a78bfa">👥 SMART CLIENT MANAGER</text>
    <text x="550" y="54" font-family="monospace" font-size="11.5" fill="#e2e8f0">OUI Hardware Detection</text>
    <text x="550" y="72" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Apple, Samsung, Intel, Xiaomi</text>

    <!-- Badge 4: Multi Flasher -->
    <rect x="795" y="0" width="245" height="90" rx="14" fill="url(#badgeGrad)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="1" />
    <text x="815" y="32" font-family="-apple-system, sans-serif" font-weight="800" font-size="13.5" fill="#f43f5e">🚀 1-CLICK WEB INSTALL</text>
    <text x="815" y="54" font-family="monospace" font-size="11.5" fill="#e2e8f0">v3.0 / v2.0 / v1.0 Builds</text>
    <text x="815" y="72" font-family="sans-serif" font-size="10.5" fill="#94a3b8">Web Serial In Browser</text>
  </g>

  <!-- Author Signature Footer -->
  <text x="1120" y="358" text-anchor="end" font-family="-apple-system, sans-serif" font-weight="600" font-size="11.5" fill="#64748b">
    github.com/Itszeeshanrajput/AetherPulse-ESP32 • Built with ❤️ by Zeeshan Rajput

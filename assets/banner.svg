<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#060913" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Decorative Circuit Wave Lines -->
  <path d="M 0 180 Q 300 80, 600 180 T 1200 180" fill="none" stroke="rgba(59, 130, 246, 0.12)" stroke-width="2" />
  <path d="M 0 220 Q 300 320, 600 220 T 1200 220" fill="none" stroke="rgba(139, 92, 246, 0.12)" stroke-width="2" />
  <circle cx="600" cy="180" r="280" fill="none" stroke="rgba(59, 130, 246, 0.05)" stroke-width="1" />
  <circle cx="600" cy="180" r="180" fill="none" stroke="rgba(139, 92, 246, 0.06)" stroke-width="1" />

  <!-- Central Logo Box -->
  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.3" />
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#glowGrad)" />
    <!-- Wi-Fi Waves Symbol -->
    <path d="M 40 24 C 28 24 18 29 10 37 L 40 70 L 70 37 C 62 29 52 24 40 24 Z" fill="#ffffff" />
    <circle cx="40" cy="66" r="3" fill="#3b82f6" />
  </g>

  <!-- Title & Subtitle -->
  <text x="205" y="112" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="-1">
    AETHER<tspan fill="#3b82f6">PULSE</tspan> <tspan fill="#8b5cf6">EXTREME</tspan>
  </text>
  <text x="205" y="144" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="19" fill="#94a3b8">
    Enterprise-Grade Zero-Jitter Wi-Fi Repeater &amp; Smart Range Extender for ESP32
  </text>

  <!-- Feature Badges Row -->
  <g transform="translate(100, 200)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="20" y="32" font-family="'Inter', sans-serif" font-weight="800" font-size="15" fill="#34d399">⚡ HARDWARE NAPT</text>
    <text x="20" y="54" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Zero-CPU L3 Packet Routing</text>

    <!-- Badge 2 -->
    <rect x="240" y="0" width="220" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="260" y="32" font-family="'Inter', sans-serif" font-weight="800" font-size="15" fill="#60a5fa">🎯 1D KALMAN FILTER</text>
    <text x="260" y="54" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Q=0.008 Smooth Auto-Roam</text>

    <!-- Badge 3 -->
    <rect x="480" y="0" width="220" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="500" y="32" font-family="'Inter', sans-serif" font-weight="800" font-size="15" fill="#a78bfa">📶 ANTI-JITTER PHY</text>
    <text x="500" y="54" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">WIFI_PS_NONE + 103 TU Beacon</text>

    <!-- Badge 4 -->
    <rect x="720" y="0" width="260" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <text x="740" y="32" font-family="'Inter', sans-serif" font-weight="800" font-size="15" fill="#f43f5e">🌐 1-CLICK WEB FLASH</text>
    <text x="740" y="54" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">ESP Web Tools In Browser</text>
  </g>
</svg>

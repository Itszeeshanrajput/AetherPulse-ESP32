<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Terminal Window Shell -->
  <rect width="900" height="520" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)" />
  
  <!-- Terminal Titlebar -->
  <rect width="900" height="38" rx="14" fill="#0f172a" />
  <circle cx="20" cy="19" r="6" fill="#ef4444" />
  <circle cx="40" cy="19" r="6" fill="#f59e0b" />
  <circle cx="60" cy="19" r="6" fill="#10b981" />
  <text x="450" y="24" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">AetherPulse Terminal Shell — 115200 8N1 (/dev/ttyUSB0)</text>

  <!-- Shell Output Text -->
  <g transform="translate(24, 65)" font-family="'JetBrains Mono', monospace" font-size="12" line-height="1.4">
    <text x="0" y="0" fill="#3b82f6" font-weight="700">aetherpulse&gt; <tspan fill="#ffffff">status</tspan></text>

    <text x="0" y="22" fill="#64748b">---------------- AETHERPULSE SYSTEM STATUS ----------------</text>
    <text x="0" y="42" fill="#94a3b8">  Device:             <tspan fill="#fff">ESP32-D0WD-V3 (Rev 3.1) @ 240 MHz</tspan></text>
    <text x="0" y="60" fill="#94a3b8">  Free DRAM (Heap):   <tspan fill="#34d399">188,388 bytes</tspan> (Modem Sleep: <tspan fill="#f59e0b">DISABLED</tspan>)</text>
    
    <text x="0" y="84" fill="#3b82f6" font-weight="700">--- Upstream Station (STA) Link ---</text>
    <text x="0" y="102" fill="#94a3b8">  Connected:          <tspan fill="#34d399" font-weight="700">YES</tspan> (SSID: <tspan fill="#fff">Nayatel</tspan>, Channel: <tspan fill="#fff">11</tspan>)</text>
    <text x="0" y="120" fill="#94a3b8">  Filtered RSSI:      <tspan fill="#34d399" font-weight="700">-66.3 dBm</tspan> (1D Kalman Filtered)</text>
    <text x="0" y="138" fill="#94a3b8">  Assigned IP:        <tspan fill="#fff">192.168.18.77</tspan> (Gateway: <tspan fill="#fff">192.168.18.1</tspan>)</text>

    <text x="0" y="162" fill="#3b82f6" font-weight="700">--- Repeater SoftAP &amp; NAPT Routing ---</text>
    <text x="0" y="180" fill="#94a3b8">  SoftAP SSID:        <tspan fill="#fff">AetherPulse-Extender</tspan> (IP: <tspan fill="#fff">192.168.4.1</tspan>)</text>
    <text x="0" y="198" fill="#94a3b8">  Connected Clients:  <tspan fill="#34d399">1 / 8</tspan> (MAC: <tspan fill="#fff">EE:F3:10:E1:B7:7A</tspan> @ <tspan fill="#fff">-36 dBm</tspan>)</text>
    <text x="0" y="216" fill="#94a3b8">  lwIP NAPT:          <tspan fill="#34d399" font-weight="700">ACTIVE</tspan> | MSS Clamping: <tspan fill="#fff">1412 bytes</tspan></text>
    <text x="0" y="234" fill="#64748b">-----------------------------------------------------------</text>

    <text x="0" y="266" fill="#3b82f6" font-weight="700">aetherpulse&gt; <tspan fill="#ffffff">ping google.com</tspan></text>
    <text x="0" y="288" fill="#94a3b8">[PING] Testing connectivity to 'google.com'...</text>
    <text x="0" y="306" fill="#94a3b8">  DNS Resolution:     <tspan fill="#34d399">SUCCESS -&gt; 142.250.202.14</tspan></text>
    <text x="0" y="324" fill="#94a3b8">  TCP Handshake:      <tspan fill="#34d399">SUCCESS to 142.250.202.14 (RTT: 258 ms)</tspan></text>
    <text x="0" y="342" fill="#34d399" font-weight="700">  Internet Status:    100% ONLINE &amp; REACHABLE</text>

    <text x="0" y="374" fill="#3b82f6" font-weight="700">aetherpulse&gt; <tspan fill="#ffffff">add "HomeNetwork" "SecretPass123" 8</tspan></text>
    <text x="0" y="396" fill="#94a3b8">[CLI] Network 'HomeNetwork' successfully saved with priority 8.</text>

    <text x="0" y="426" fill="#3b82f6" font-weight="700">aetherpulse&gt; <tspan fill="#ffffff">_</tspan><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" /></text>
  </g>
</svg>

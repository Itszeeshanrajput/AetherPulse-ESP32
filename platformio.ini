[platformio]
default_envs = esp32_repeater
src_dir = .
include_dir = .

[env:esp32_repeater]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv

build_src_filter =
    +<*.cpp>
    +<*.ino>
    -<.pio/>
    -<build/>
    -<build_output/>
    -<docs/>
    -<assets/>
    -<bin/>
    -<showcase/>

build_unflags =
    -D CORE_DEBUG_LEVEL=0

build_flags =
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
